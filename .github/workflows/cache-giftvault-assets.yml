name: Cache verified 640px collectible assets
on:
  push:
    branches: [giftvault-visual-demo]
    paths:
      - ".github/workflows/cache-giftvault-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify HD media from Fragment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user -q pillow
          mkdir -p giftvault-v3/assets
          python3 - <<'PY'
          import io, pathlib, urllib.request
          from PIL import Image
          slugs=['plushpepe','durovscap','heartlocket','diamondring','lootbag','sakuraflower','scaredcat','swisswatch','signetring','preciouspeach','icecream','bdaycandle']
          root=pathlib.Path('giftvault-v3/assets')
          for slug in slugs:
            url=f'https://nft.fragment.com/gift/{slug}-1.large.jpg'
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=20) as response: raw=response.read()
            image=Image.open(io.BytesIO(raw));image.verify()
            image=Image.open(io.BytesIO(raw))
            if image.width<600 or image.height<600: raise RuntimeError('Insufficient resolution for '+slug)
            (root/(slug+'.jpg')).write_bytes(raw)
            print('Downloaded',slug,image.size,len(raw))
          PY
      - name: Commit verified static image assets only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add giftvault-v3/assets
          if git diff --cached --quiet; then echo "Already cached"; exit 0; fi
          git commit -m "Cache verified 640px Fragment gift images for reliable mobile preview"
          git push origin HEAD:giftvault-visual-demo
