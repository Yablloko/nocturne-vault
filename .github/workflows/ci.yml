name: Проверка

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить код
        run: pnpm check

      - name: Запустить тесты
        run: pnpm test

  android:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Установить JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Установить Android SDK 37
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkManager --channel=3 --install 'platforms;android-37' 'build-tools;36.0.0'

      - name: Собрать Android и запустить unit-тесты
        working-directory: android
        shell: pwsh
        run: .\build-android.ps1

      - name: Проверить Android Lint
        working-directory: android
        run: .\gradlew.bat :app:lintRelease --no-daemon --max-workers=1
