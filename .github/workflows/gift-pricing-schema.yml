name: Validate TG Gifts timed sales schema
on:
  push:
    branches: [giftvault-visual-demo]
    paths: [".github/workflows/gift-pricing-schema.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Validate prices data format
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json
          url='https://tggifts.com/data/floors-daily.json'
          request=urllib.request.Request(url,headers={'User-Agent':'GiftVault-Pricing-QA/1.0'})
          with urllib.request.urlopen(request,timeout=25) as f: data=json.load(f)
          print('ROOT', sorted(data.keys()))
          print('COLLECTION_KEYS', list(data.get('collections',{}))[:8])
          for k,v in data.items():
            if k=='collections': continue
            if isinstance(v,dict): print('DICT',k,sorted(v.keys())[:12])
            elif isinstance(v,list): print('LIST',k,len(v),type(v[0]).__name__ if v else 'empty')
          for slug in ['plushpepe','durovscap','signetring','heartlocket','diamondring']:
            c=data.get('collections',{}).get(slug)
            print('BUY_NOW',slug,repr(c)[:380])
          for k,v in data.items():
            if isinstance(v,dict):
              if 'items' in v and isinstance(v['items'],list):
                print('TIMED_CANDIDATE',k,len(v['items']),[repr(x)[:260] for x in v['items'] if x.get('slug') in ('plushpepe','durovscap','signetring')])
          PY
